services:
  db:
    image: postgres:15-alpine
    container_name: onetask-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onetask
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onetask-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onetask-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/onetask
      SECRET_KEY: sua-chave-secreta-aqui-mudar-em-producao
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onetask-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onetask-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - onetask-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  onetask-network:
    driver: bridge
